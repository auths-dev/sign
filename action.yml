name: 'Sign with Auths'
description: 'Sign build artifacts using ephemeral Auths keys in CI — no secrets needed'
author: 'auths'

inputs:
  files:
    description: 'Glob patterns for files to sign, one per line'
    required: false
    default: ''
  commits:
    description: 'Git revision range to sign (e.g., HEAD~1..HEAD). Merge commits are skipped.'
    required: false
    default: ''
  commit-sha:
    description: 'Commit SHA to anchor ephemeral attestation to (default: GITHUB_SHA)'
    required: false
    default: ''
  note:
    description: 'Optional note to include in the attestation'
    required: false
    default: ''
  auths-version:
    description: 'Auths CLI version to pin (e.g. "0.0.1-rc.12"). Required unless `auths` is on PATH — the action never resolves `latest` (supply-chain hardening). The pinned release must publish a `.sha256` checksum.'
    required: false
    default: ''
  fail-on-unanchored:
    description: 'Fail (instead of warn) when this repo has no `.auths/roots` trust root, so signing never silently produces an attestation that verifiers cannot anchor.'
    required: false
    default: 'false'

outputs:
  signed-files:
    description: 'JSON array of file paths that were signed'
  attestation-files:
    description: 'JSON array of attestation file paths (.auths.json)'
  signed-commits:
    description: 'JSON array of signed commit SHAs'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'edit-3'
  color: 'blue'
